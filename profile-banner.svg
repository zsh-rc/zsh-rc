<svg fill="none" width="100%" height="160" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        /* Container styling and Rainbow border setup */
        .card {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          background: #0d1117;
          border-radius: 12px;
          height: 140px;
          padding: 2px; /* Pulls container back to reveal the pseudo-border gradient */
          position: relative;
          z-index: 1;
          overflow: hidden;
          box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* The moving rainbow animation layer */
        .card::before {
          content: '';
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: conic-gradient(#ff007f, #7f00ff, #00f0ff, #ff007f);
          animation: rotate-border 4s linear infinite;
          z-index: -2;
        }

        /* Inner container masks the center back to dark grey */
        .inner-content {
          background: #161b22;
          border-radius: 10px;
          height: calc(100% - 32px);
          padding: 16px;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        h1 {
          color: #ffffff;
          font-size: 1.6rem;
          margin: 0 0 8px 0;
        }

        /* ── TYPING ANIMATION RULES ── */
        .typing-container {
          display: flex;
          align-items: center;
        }

        .typing-text {
          color: #58a6ff;
          font-family: monospace;
          font-size: 1.1rem;
          font-weight: bold;
          white-space: nowrap;
          overflow: hidden;
          border-right: 3px solid #58a6ff; /* The typewriter cursor */
          width: 0;
          animation: 
            type-in 3.5s steps(30, end) infinite,
            blink-cursor 0.75s step-end infinite;
        }

        /* Rotation Keyframe for the Glow Border */
        @keyframes rotate-border {
          100% { transform: rotate(360deg); }
        }

        /* Typing Effect Keyframe: steps from 0 width to full text scope, holds, then loops */
        @keyframes type-in {
          0% { width: 0; }
          40%, 75% { width: 100%; } /* Holds full text visible between 40% and 75% */
          90%, 100% { width: 0; }   /* Quickly clears back to zero to loop cleanly */
        }

        /* Cursor Blinking Keyframe */
        @keyframes blink-cursor {
          from, to { border-color: transparent; }
          50% { border-color: #58a6ff; }
        }
      </style>
      
      <!-- HTML Layout -->
      <div class="card">
        <div class="inner-content">
          <h1>Hi, I'm a Software Engineer 👋</h1>
          
          <div class="typing-container">
            <!-- Ensure the character length aligns closely with your animation steps -->
            <div class="typing-text">Building cool client-side Angular tools...</div>
          </div>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
